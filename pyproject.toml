[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmodelsoc"
version = "0.1.0"
description = "Experiments for heavy-tailed memory traces in language agents and Core–Tail Memory Controller (CTMC)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Xinyuan Song"},
  {name = "Zekun Cai"}
]
dependencies = [
  "openai>=1.0",
  "networkx>=3.0",
  "numpy>=1.24",
  "powerlaw>=1.4",
  "scipy>=1.11",
  "tqdm>=4.65",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
alfworld = ["alfworld>=0.3"]
longmemeval = ["backoff>=2.2"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
